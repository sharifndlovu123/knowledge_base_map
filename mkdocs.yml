# for configuration
# themes, bootstrap386, material, simple-blog 
site_name: My Knowledge Base
docs_dir: 'Collection' 

# repo_url: https://github.com/sharifndlovu123/knowledge_base_map
site_url: https://www.knowledgemap.devbridge.co.za
copyright: Sharif Ndlovu | 'Build Test Deploy'
theme:
  name: material
  favicon: assets/face-logo.svg
  logo: assets/face-logo.svg

  font:
    text: Space Grotesk
    code: Space Mono

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - awesome-nav
  - obsidian-bridge  
  - exclude:
      glob:
        - DevBridge/*
        - 02. Networking/My Roadmap/*
        - 02. Networking/Network path.md
        - Frameworks/Django/*
        - "*.tmp"
        - "*.gz"
  - mermaid2

  # Images
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class-name
      auto_caption: false
      caption_position: bottom
      background: white
      shadow: true
      manual: false

  # - minify:
  #     minify_html: true
  #     minify_js: true
  #     minify_css: true
  #     htmlmin_opts:
  #         remove_comments: true
  #     cache_safe: true
  #     js_files:
  #         - my/javascript/dir/file1.js
  #         - my/javascript/dir/file2.js
  #     css_files:
  #         - my/css/dir/file1.css
  #         - my/css/dir/file2.css


# Navigation order and grouping live in .nav.yml files (mkdocs-awesome-nav) inside Collection/

#  Mermaid

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.magiclink
  - pymdownx.superfences
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # - obsidian_callouts
  - pymdownx.superfences:
        # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

mermaid:
  version: 10.4.0  # or whatever version you want to use

use_directory_urls: false

extra_css:
  - assets/css/blueprint.css

# extra_javascript:
#   - "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"

