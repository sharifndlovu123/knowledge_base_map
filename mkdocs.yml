# for configuration
# themes, bootstrap386, material, simple-blog 
site_name: My Knowledge Base
docs_dir: 'Collection' 

# repo_url: https://github.com/sharifndlovu123/knowledge_base_map
site_url: https://www.knowledgemap.devbridge.co.za
copyright: Sharif Ndlovu | 'Build Test Deploy'
theme:
  name: material
  favicon: assets/globe-green.png
  logo: assets/globe-green.png

  font:
    text: 'Fira Sans, sans-serif'
    code: 'Fira Mono, monospace'

  # theme_style: dark
  site_name_style: bold
  # title_style: bold
  # sidebar: true
  navigation_depth: 5
  highlightjs: true
    - yaml
    - python
  colors:
    text: white
    title: green
    primary: white
    background: black
  components:
    site_name: false
    title: false
    menu: true
    preview: false
    footer: true



#  avaaible schemes : default (Light mode)slate (Dark mode), default high contrast , slate high contrast , dracula 
# material theme
  palette:
  # Dark theme 1: Midnight Blue
  - scheme: slate
    primary: black
    accent: green
    toggle:
      icon: material/weather-night
      # name: Switch to Emerald Dark
    
  # Dark theme 2: Emerald Dark
  - scheme: default
    primary: black
    accent: indigo
    toggle:
      icon: material/forest
      name: Switch to Tech Dark
    
  # Dark theme 3: Tech Dark
  # - scheme: slate
  #   primary: red
  #   accent: red
  #   toggle:
  #     icon: material/shield
      # name: Switch to Light Classic
      


  features:
    - navigation.tabs
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - awesome-nav
  - obsidian-bridge  
  - exclude:
      glob:
        - DevBridge/*
        - Networking/My Roadmap/*
        - Networking/Network path.md
        - Frameworks/Django/*
        - "*.tmp"
        - "*.gz"
  - mermaid2

  # Images
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - custom-skip-class-name
      auto_caption: false
      caption_position: bottom
      background: white
      shadow: true
      manual: false

  # - minify:
  #     minify_html: true
  #     minify_js: true
  #     minify_css: true
  #     htmlmin_opts:
  #         remove_comments: true
  #     cache_safe: true
  #     js_files:
  #         - my/javascript/dir/file1.js
  #         - my/javascript/dir/file2.js
  #     css_files:
  #         - my/css/dir/file1.css
  #         - my/css/dir/file2.css


nav:
  - Home: 'index.md'
  - Whats New: 'Whats New.md'
  - Orchestration:
      - 'Orchestration/Orchestration Platforms.md'
      - Kubernetes:
          - 'Orchestration/Kubernetes/Local Kubernetes Tools.md'
          - 'Orchestration/Kubernetes/kubectl Cheat Sheet.md'
          - 'Orchestration/Kubernetes/Chapters/2. Kubernetes Architecture – from Container Images to Running Pods.md'
          - 'Orchestration/Kubernetes/Chapters/3. Installing Your First Kubernetes Cluster.md'
          - 'Orchestration/Kubernetes/Chapters/4. Running Your Containers in Kubernetes.md'
      - Docker:
          - 'Orchestration/Docker/1. Docker.md'
          - 'Orchestration/Docker/2. Docker Compose.md'
          - 'Orchestration/Docker/3. Container Images and Build Tools.md'
      - Camunda:
          - 'Orchestration/Camunda/Common Camunda Use Cases.md'
          - 'Orchestration/Camunda/Camunda 8/Camunda 8 Code Studio Tutorial.md'
  # - Django:
  #     - 'Collection/Django/*.md'
  # - DevBridge:
  #     - 'Collection/DevBridge/*.md'
  # - Programming:
  #     - 'Collection/Programming/*'
  # - Networking:   
  #     # - 'Collection/Networking Path/Content/*.md'
  #   - Deepseek_Solution: 'Networking Path/My Roadmap/Deepseek Solution.md'
  #   - Linux_Distros: 'Networking Path/My Roadmap/Linux Distros.md'
  #   - MyPath: 'Networking Path/My Roadmap/My Path.md'
  #   - Networking_Projects: 'Networking Path/My Roadmap/Networking Projects.md'
      

#  Mermaid

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.magiclink
  - pymdownx.superfences
  - md_in_html
  # - obsidian_callouts
  - pymdownx.superfences:
        # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

mermaid:
  version: 10.4.0  # or whatever version you want to use

use_directory_urls: false

extra_css:
  - assets/css/custom.css

# extra_javascript:
#   - "https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"

